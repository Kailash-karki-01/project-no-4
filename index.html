<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <h1>Form</h1>
        <div class="input-container">
            <label for="First Name">First Name
                <input type="text" name="fname" id="fname" placeholder="First Name">
            </label>
            <label for="Middle Name">Middle Name
                <input type="text" name="mname" id="mname" placeholder="Middle Name"></label>
            <label for="last Name">Last Name <input type="text" name="lname" id="lname"
                placeholder="Last Name"></label>
            <label for="Email">Email <input type="email" name="email" id="email" placeholder="Email"></label>
            <label for="Number">Number<input type="tel" name="phnumber" id="phnumber" placeholder="Ph.Number"></label>
        </div>
        <div class="submition">
            <button type="submit">Submit</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
